<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Jettx</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        margin: 0;
        overflow: hidden;
        background: #0a0a0a;
        height: 100%;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        color-scheme: dark;
      }

      .logo {
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        object-fit: cover;
        object-position: center;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        class="logo"
        src="assets/logo-dark.png"
        alt="Jettx"
        width="1649"
        height="929"
      />
    </main>
  </body>
</html>
